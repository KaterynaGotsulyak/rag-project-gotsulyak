# Single point of configuration for the RAG system stack (Lab 1)
project:
  name: python-docs-assistant
  language: en            # corpus and query language
corpus:
  source: python/cpython, Doc directory (reStructuredText)
  tag: v3.14.10           # commit b703b2c; 543 .rst files, ~1.6M words
  license: PSF License; code examples - Zero-Clause BSD
  chunking: by_section    # split by section
  chunk_words: 250
embeddings:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  normalize: true
  max_seq_length: 512
vector_store:
  engine: chroma
  path: chroma_db         # local directory (in .gitignore)
  collection: python_docs
  metric: cosine          # HNSW, space=cosine
retrieval:
  top_k: 5
  min_score: 0.35         # preliminary value; refined in Labs 4-5
generation:
  host: http://localhost:11434
  model: qwen2.5:7b-instruct   # fallback: llama3.2:3b
  temperature: 0.1
  num_ctx: 8192
  max_answer_words: 200
